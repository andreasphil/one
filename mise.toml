[tools]
go = "1.27.0"
node = "26.8.1"
pnpm = "12.2.1"
watchexec = "2.7.1"

[env]
GOTOOLCHAIN = "local"
ONE_DEBUG = 1

[tasks.dev]
run = "mise watch -rc -- web"

[tasks.web]
usage = """
  arg "<file>" default="one.md"
"""
run = "go run . web --input ${usage_file}"
sources = ["**/*.{go,html,css,js}"]

[tasks.fmt]
run = ["go fmt", "pnpm prettier -cw web/"]

[tasks.test]
run = "go test ./..."
