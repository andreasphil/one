[tools]
go = "1.27.3"
node = "26.12.0"
pnpm = "12.14.0"
watchexec = "2.8.0"

[env]
GOTOOLCHAIN = "local"
ONE_DEBUG = 1

[tasks.dev]
run = "mise watch -rc -- web"

[tasks.web]
usage = """
  arg "<file>" default="one.md"
  arg "<port>" default="1110"
"""
run = "go run . web --input ${usage_file} --port ${usage_port}"
sources = ["**/*.{go,html,css,js}"]

[tasks.fmt]
run = ["go fmt", "pnpm prettier -cw web/"]

[tasks.test]
run = "go test ./..."

[tasks.typecheck]
run = "pnpm tsc"

[tasks.fuzz]
usage = """
  arg "<duration>" default="1m"
"""
run = "go test ./lib/note -fuzz FuzzParse -fuzztime ${usage_duration}"
