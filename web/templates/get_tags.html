{{ template "layout.html" . }}
{{ define "sidebar" }}
  {{ template "navigation.html" . }}
{{ end }}

{{ define "content" }}
  <div class="tags-view" has-fallback="{{ if not .Tags }}empty{{ end }}">
    <div>
      <h1>{{ len .Tags }} tags</h1>
      <ul>
        {{ range .Tags }}
          <li>
            <a href="/tags/{{ . }}/" class="tag">
              {{ . }}
            </a>
          </li>
        {{ end }}
      </ul>
    </div>

    <div fallback-for="empty">
      <p>{{ template "tag-x.svg" }}</p>
      <p>No tags.</p>
    </div>
  </div>
{{ end }}
