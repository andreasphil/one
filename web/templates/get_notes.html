{{template "layout.html" .}} {{define "content"}}
<div>
  <h1>Notes</h1>

  <ul>
    {{range .Data.Notes}}
    <li><a href="/notes/{{.Slug}}">{{.Title}}:</a> {{.Excerpt}}</li>
    {{range .Children}}
    <li><a href="/notes/{{.Slug}}">{{.Title}}:</a> {{.Excerpt}}</li>
    {{end}} {{end}}
  </ul>
</div>
{{end}}
