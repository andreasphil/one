{{$currentUrl := .CurrentUrl}}
<nav>
  <strong>One</strong>
  <ul>
    <li>
      <a
        href="/notes/"
        {{if hasPrefix $currentUrl "/notes/"}}aria-current="page"{{end}}
      >
        {{template "sticky-note.svg"}}
        Notes
      </a>
    </li>
    <li>
      <a
        href="/attachments/"
        {{if hasPrefix $currentUrl "/attachments/"}}aria-current="page"{{end}}
      >
        {{template "paperclip.svg"}}
        Attachments
      </a>
    </li>
    <li>
      <a
        href="/calendar/"
        {{if hasPrefix $currentUrl "/calendar/"}}aria-current="page"{{end}}
      >
        {{template "calendar.svg"}}
        Calendar
      </a>
    </li>
    <li>
      <a
        href="/tags/"
        {{if hasPrefix $currentUrl "/tags/"}}aria-current="page"{{end}}
      >
        {{template "tag.svg"}}
        Tags
      </a>
    </li>
    <li>
      <a
        href="/search/"
        {{if hasPrefix $currentUrl "/search/"}}aria-current="page"{{end}}
      >
        {{template "search.svg"}}
        Search
      </a>
    </li>

    <li><hr /></li>

    <li class="caps font-size-small color-primary font-weight-medium">
      Saved
    </li>

    <li has-fallback="empty">
      <div></div>
      <div fallback-for="empty">
        <span>{{template "sticker.svg"}}</span>
        <p>Nothing saved.</p>
      </div>
    </li>
  </ul>
</nav>
