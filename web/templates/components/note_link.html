{{ $noteURL := printf "/notes/%s/" .Note.Slug }}
<a
  href="{{ $noteURL }}"
  title="{{ .Note.Title }}"
  {{ if eq .CurrentURL $noteURL }}aria-current="page"{{ end }}
>
  <span class="clamp">
    {{ if .Note.IsDailyNote }}
      {{ .Note.Date.Format "Mon," }}
    {{ end }}
    {{ .Note.Title }}
  </span>
</a>
