{{ $noteURL := printf "/notes/%s/" .Note.Slug }}
<a
  href="{{ $noteURL }}"
  title="{{ .Note.Title }}"
  {{ if eq .CurrentURL $noteURL }}aria-current="page"{{ end }}
>
  <span class="clamp">
    {{ .Note.Title }}
    {{ if .Note.IsDailyNote }}
      <span class="color-variant">
        {{ .Note.Date.Format "Mon" }}
      </span>
    {{ end }}
  </span>
</a>
