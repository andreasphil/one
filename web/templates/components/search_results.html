<ul class="search-results">
  {{- range $i, $result := . -}}
    <li>
      <header>
        <a href="/notes/{{ .Slug }}/">{{ $result.Title }}</a>
        {{ if not $result.Date.IsZero }}
          <span class="color-variant font-weight-medium">
            ({{ $result.Date.Format "02.01.2006" }})
          </span>
        {{ end }}
      </header>
      <div class="prose">{{ $result.HTML }}</div>
    </li>
  {{- end -}}
</ul>
