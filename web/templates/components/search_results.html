<ul id="results" class="search-results">
  {{- range . -}}
  <li id="result-{{ .Slug }}">
    <header>
      <a href="/notes/{{ .Slug }}/">{{ .Title }}</a>
      {{ if not .Date.IsZero }}
      <span class="color-variant font-weight-medium">
        ({{ .Date.Format "02.01.2006" }})
      </span>
      {{ end }}
    </header>
    <div class="prose">{{- .HTML -}}</div>
  </li>
  {{- end -}}
</ul>
